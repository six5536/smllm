# A host-driven machine (README.md): a model without tools triages a
# support ticket, the host checks the triage, and the model tries again with
# the errors, up to five attempts.
id: ticket-triage
description: Triage a support ticket, and have the host check the triage.
initial: READ
meta:
  smllm: 1
  instance:
    kind: ticket
  events:
    triage:
      description: Answer with the ticket's triage.
      params:
        type: object
        properties:
          json:
            type: json
            schema: schemas/triage.json
            description: The triage.
        required: [json]
    history:
      description: Ask for the customer's earlier tickets.
      params:
        type: object
        properties:
          tickets:
            type: string
            pattern: "^[0-9]+(,[0-9]+)*$"
            description: The numbers of the tickets to read, such as 3,4.
        required: [tickets]
    checks_passed:
      source: host
      description: The triage passed the host's checks.
    checks_failed:
      source: host
      description: The triage failed the host's checks.
      params:
        type: object
        properties:
          errors: { type: string, description: What failed. }
        required: [errors]
    timed_out:
      source: host
      description: The model took too long to answer.
states:
  READ:
    meta: { entryPoint: true }
    entry: { type: prompt, params: { file: prompts/read.md } }
    on:
      triage: CHECKING
      history: READ
      timed_out: FAILED
  CHECKING:
    # The host runs its checks of the triage, and fires checks_passed or
    # checks_failed.
    invoke: { src: runChecks }
    entry: { type: prompt, params: { text: The host checks the triage. } }
    on:
      checks_passed: ACCEPTED
      checks_failed:
        - guard: { type: visits, params: { state: READ, atLeast: 5 } }
          target: FAILED
        - target: READ
  ACCEPTED:
    type: final
  FAILED:
    type: final
