[tools]
node = "26"

python = '3.14'
# 1.98 is the project toolchain; nightly is used only by the coverage
# subcommand (cargo +nightly llvm-cov), which needs `coverage(off)` markers.
# The wasm build uses its own dated nightly, which `npm run build:wasm`
# installs (scripts/build-wasm.mjs NIGHTLY).
rust = ['1.98', 'nightly']
zig = "0.16.0"
cargo-binstall = "1.24.0"

"npm:@anthropic-ai/claude-code" = { version = "latest", npm_args = "--ignore-scripts=false" }
"github:rtk-ai/rtk" = "0.50.0"

"cargo:cargo-zigbuild" = "0.23.4"
"cargo:cargo-nextest" = "0.9.146"
"cargo:cargo-llvm-cov" = "0.9.1"
# Must match the wasm-bindgen crate version in Cargo.lock (npm run build:wasm).
"cargo:wasm-bindgen-cli" = "0.2.129"
gh = "latest"
# Writes the release notes from the commit subjects (cliff.toml). Matches the
# version that the release and export workflows install.
git-cliff = "2.14.2"
# Builds the documentation site from docs/ (scripts/docs-build.mjs, book.toml).
# Matches the version that the mirror's publish workflow installs.
"cargo:mdbook" = "0.5.4"
# The knowledge store's validator (knowledge/, .sokf/config.toml). sokf is the
# maintainer's own package, younger than mise's minimum package age, so this entry
# alone approves it.
"npm:@six5536/sokf" = { version = "0.1.3", allow_low_downloads = true }
